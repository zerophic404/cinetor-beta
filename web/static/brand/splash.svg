<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640">
<defs><linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF2D3B"/><stop offset="1" stop-color="#B00610"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter></defs>
<style>
  #ring{stroke-dasharray:703.8 703.8;animation:draw 700ms cubic-bezier(.65,0,.35,1) both}
  #glow{opacity:.35;animation:pulse 1200ms ease-out both}
  #play{transform-box:fill-box;transform-origin:40% 50%;animation:pop 400ms cubic-bezier(.34,1.56,.64,1) 500ms both}
  #word{animation:fade 450ms ease-out 700ms both}
  @keyframes draw{from{stroke-dashoffset:703.8}to{stroke-dashoffset:0}}
  @keyframes pulse{0%,40%{opacity:0}70%{opacity:.9}100%{opacity:.35}}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#ring,#glow,#play,#word{animation:none}}
</style><rect width="512" height="640" fill="#000000"/>
<g transform="translate(96 80) scale(0.625)">
<path id="glow" d="M 364.5 158.3 A 146 146 0 1 0 364.5 353.7" fill="none" stroke="#E50914" stroke-width="82.0" filter="url(#glow)"/>
<path id="ring" d="M 364.5 158.3 A 146 146 0 1 0 364.5 353.7" fill="none" stroke="url(#red)" stroke-width="62.0"/>
<path id="play" d="M220 196 L220 316 L322 256 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
</g>
<text id="word" x="256" y="566" text-anchor="middle" font-family="Montserrat, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="46" letter-spacing="11" fill="#FFFFFF">CINETOR</text>
</svg>
