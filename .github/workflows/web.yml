name: Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_PATH: /cinetor-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_web: ${{ steps.detect.outputs.has_web }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect web project
        id: detect
        run: echo "has_web=${{ hashFiles('web/package.json') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Placeholder (web not yet created)
        if: hashFiles('web/package.json') == ''
        run: echo 'web not yet created'

      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: '22'

      - name: Install
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci && exit 0; fi
          npm install --no-audit --no-fund && exit 0
          echo 'retrying with --legacy-peer-deps'; npm install --no-audit --no-fund --legacy-peer-deps && exit 0
          echo '::group::npm debug log'; tail -n 120 $(ls -t ~/.npm/_logs/*-debug-0.log | head -1); echo '::endgroup::'
          exit 1

      - name: Build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        env:
          PUBLIC_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: npm run build

      - name: Test
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm test --if-present

      - name: Typecheck (svelte-check)
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run check --if-present

      - name: Upload web build artifact
        if: hashFiles('web/package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          retention-days: 14

      - name: Deploy to public cinetor-app gh-pages
        if: hashFiles('web/package.json') != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: Ashrix404/cinetor-app
          publish_branch: gh-pages
          publish_dir: web/build
          force_orphan: true
          enable_jekyll: false
          commit_message: "deploy web ${{ github.sha }}"
