name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Unit tests
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/cinetor-build${{ github.run_number }}-debug.apk"
          ls -la out
          # Mock catalog must be bundled from shared/mock (generated assets, not in git)
          unzip -l out/*.apk | grep -q 'assets/mock/home.json'
          unzip -l out/*.apk | grep -q 'assets/mock/images/posters/'
          echo "mock assets: $(unzip -l out/*.apk | grep -c 'assets/mock/') files"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/out/*.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/out/*.apk
          make_latest: true
