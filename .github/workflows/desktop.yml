name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*', 'desktop-v*']
    paths:
      - 'desktop/**'
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install web dependencies
        working-directory: web
        shell: bash
        run: npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install desktop dependencies
        working-directory: desktop
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Sync Tauri bundle version on release tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER="${REF_NAME#desktop-}"
          VER="${VER#v}"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export VER
            node -e '
              const fs = require("fs");
              const p = "desktop/src-tauri/tauri.conf.json";
              const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
              cfg.version = process.env.VER;
              fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
            '
            echo "Synced Tauri bundle version to $VER"
          else
            echo "Tag $REF_NAME is not strict X.Y.Z semver; keeping tauri.conf.json version"
          fi

      - name: Build installers (tauri build → web at root path)
        working-directory: desktop
        shell: bash
        env:
          PUBLIC_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          PUBLIC_GATEWAY_SECRET: ${{ secrets.GATEWAY_SIGNING_SECRET }}
        run: npm run tauri -- build

      - name: Rust unit tests (download engine)
        if: matrix.name == 'linux'
        working-directory: desktop/src-tauri
        run: cargo test --release --lib

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-${{ matrix.name }}
          B=desktop/src-tauri/target/release/bundle
          find "$B" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist-${{ matrix.name }}/ \;
          ls -la dist-${{ matrix.name }}
          if [ "${{ matrix.name }}" = windows ]; then ls dist-${{ matrix.name }}/*.exe dist-${{ matrix.name }}/*.msi; else ls dist-${{ matrix.name }}/*.deb dist-${{ matrix.name }}/*.AppImage; fi

      - name: Check .deb dependencies
        if: matrix.name == 'linux'
        run: dpkg-deb -I dist-linux/*.deb | grep -E 'Depends:.*gstreamer1.0-libav'

      - name: Cache built installers for release job
        uses: actions/cache/save@v4
        with:
          path: dist-${{ matrix.name }}
          key: desktop-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  release:
    needs: build
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Restore Windows installers
        uses: actions/cache/restore@v4
        with:
          path: dist-windows
          key: desktop-windows-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore Linux installers
        uses: actions/cache/restore@v4
        with:
          path: dist-linux
          key: desktop-linux-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Stage combined installers
        run: |
          mkdir -p dist
          cp dist-windows/* dist-linux/* dist/
          ls -la dist

      - name: Release info + checksums
        id: info
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          ls -la dist
          ls dist/*.exe dist/*.msi dist/*.deb dist/*.AppImage
          (cd dist && sha256sum *) | tee SHA256SUMS-desktop.txt
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Cinetor $REF_NAME" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "append=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/tags/desktop-v* ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Cinetor Desktop $REF_NAME" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "append=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=desktop-build-$RUN_NUM" >> "$GITHUB_OUTPUT"
            echo "name=Cinetor Desktop build $RUN_NUM" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "append=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Windows & Linux Desktop"
            echo "Cinetor desktop (Tauri) — commit $SHA."
            echo '- **Windows:** `*-setup.exe` (NSIS, per-user) or `*.msi`'
            echo '- **Linux:** `*.deb` (Debian/Ubuntu; pulls GStreamer for video) or `*.AppImage` (`chmod +x`, run)'
            echo "Native downloads are saved to Downloads/Cinetor."
            echo
            echo "Desktop files:"
            for f in dist/*; do echo "- $(basename "$f") — $(du -h "$f" | cut -f1)"; done
          } > desktop-notes.md
          cat desktop-notes.md

      - name: Publish to public cinetor-app releases
        uses: softprops/action-gh-release@v2
        with:
          repository: Ashrix404/cinetor-app
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.info.outputs.tag }}
          target_commitish: main
          name: ${{ steps.info.outputs.name }}
          make_latest: ${{ steps.info.outputs.latest }}
          append_body: ${{ steps.info.outputs.append }}
          body_path: desktop-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*
            SHA256SUMS-desktop.txt
