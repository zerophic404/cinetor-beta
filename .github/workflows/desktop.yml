name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder (desktop not yet created)
        if: hashFiles('desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/Cargo.toml') == ''
        shell: bash
        run: echo 'desktop not yet created'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04' && hashFiles('desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        if: hashFiles('desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/Cargo.toml') != ''
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/Cargo.toml') != ''

      - uses: swatinem/rust-cache@v2
        if: hashFiles('desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/Cargo.toml') != ''
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install frontend dependencies
        if: hashFiles('desktop/package.json') != ''
        working-directory: desktop
        shell: bash
        run: npm ci || npm install

      - name: Build with Tauri
        if: hashFiles('desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/Cargo.toml') != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Cinetor {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Upload bundles
        if: hashFiles('desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/Cargo.toml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
          retention-days: 30
