name: Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_PATH: /cinetor

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_web: ${{ steps.detect.outputs.has_web }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect web project
        id: detect
        run: echo "has_web=${{ hashFiles('web/package.json') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Placeholder (web not yet created)
        if: hashFiles('web/package.json') == ''
        run: echo 'web not yet created'

      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: '22'

      - name: Install
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci && exit 0; fi
          npm install --no-audit --no-fund && exit 0
          echo 'retrying with --legacy-peer-deps'; npm install --no-audit --no-fund --legacy-peer-deps && exit 0
          echo '::group::npm debug log'; tail -n 120 $(ls -t ~/.npm/_logs/*-debug-0.log | head -1); echo '::endgroup::'
          exit 1

      - name: Build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run build

      - name: Test
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm test --if-present

      - name: Typecheck (svelte-check)
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run check --if-present

      - name: Upload web build artifact
        if: hashFiles('web/package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          retention-days: 14

      - name: Upload Pages artifact
        if: hashFiles('web/package.json') != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    # Gated: hashFiles() is not allowed in job-level `if`, so build exposes it as an output.
    # Stays skipped until web/package.json exists; only deploys from main.
    if: needs.build.outputs.has_web == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages needs a paid plan for private repos; don't fail the workflow when it's unavailable.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
